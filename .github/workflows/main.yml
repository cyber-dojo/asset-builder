name: Sub - main

on:
  push:

jobs:

  # Each platform is built and tested on a runner of that platform, so nothing
  # is emulated. Each pushes the image it tested as :<tag>-<arch>, and publish
  # merges those into one index, so what ships is what was tested. Consumers
  # build their asset stage FROM --platform=$BUILDPLATFORM, so both are needed.
  # The two jobs differ only in runs-on and ARCH.
  build-test-amd64:
    runs-on: ubuntu-latest
    env:
      ARCH: amd64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build image
        run:
          make image

      - name: Run tests
        run:
          make tests

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push the tested image
        run: |
          TAG="${GITHUB_SHA:0:7}"
          docker tag "cyberdojo/asset_builder:${TAG}" "cyberdojo/asset_builder:${TAG}-${ARCH}"
          docker push "cyberdojo/asset_builder:${TAG}-${ARCH}"


  build-test-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build image
        run:
          make image

      - name: Run tests
        run:
          make tests

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push the tested image
        run: |
          TAG="${GITHUB_SHA:0:7}"
          docker tag "cyberdojo/asset_builder:${TAG}" "cyberdojo/asset_builder:${TAG}-${ARCH}"
          docker push "cyberdojo/asset_builder:${TAG}-${ARCH}"


  publish:
    runs-on: ubuntu-latest
    needs: [build-test-amd64, build-test-arm64]
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - uses: docker/setup-buildx-action@v4

      # A registry-side merge: the two tested manifests are named as they are,
      # in one index, under the commit tag.
      - name: Publish the multi-platform image on dockerhub
        run: |
          TAG="${GITHUB_SHA:0:7}"
          docker buildx imagetools create \
            --tag "cyberdojo/asset_builder:${TAG}" \
            "cyberdojo/asset_builder:${TAG}-amd64" \
            "cyberdojo/asset_builder:${TAG}-arm64"
